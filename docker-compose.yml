version: '3.8'

services:
  db:
    image: postgres:15
    container_name: habit_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-habit_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - habit_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: habit_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - habit_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: habit_web
    restart: always
    command: gunicorn habit_tracker_project.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - DB_NAME=${DB_NAME:-habit_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habit_network

  celery:
    build: .
    container_name: habit_celery
    restart: always
    command: celery -A habit_tracker_project worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_NAME=${DB_NAME:-habit_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - redis
      - db
    networks:
      - habit_network


  celery-beat:
    build: .
    container_name: habit_celery_beat
    restart: always
    command: celery -A habit_tracker_project beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_NAME=${DB_NAME:-habit_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - celery
    networks:
      - habit_network

    nginx:
    image: nginx:alpine
    container_name: habit_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - habit_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  habit_network:
    driver: bridge